<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c8302a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>808 — Rhythm Composer</title>
<style>
/* ===== Base ===== */
:root {
  --bg-wood:        #6b3a1d;
  --bg-wood-light:  #8a4d28;
  --bg-panel:       #d8c9a8;
  --bg-panel-dark:  #b8a886;
  --bg-panel-deep:  #9c8c6d;
  --ink:            #1a1a1a;
  --ink-soft:       #3a3326;
  --accent-red:     #c8302a;
  --accent-red-d:   #8c1f1b;
  --accent-orange:  #e88a2e;
  --accent-yellow:  #efc94c;
  --accent-white:   #f1ead6;
  --led-on:         #ff8a1f;
  --led-off:        #4a3a28;
  --mute-red:       #a8302a;
  --solo-yellow:    #efc94c;
  --display-bg:     #1a0f06;
  --display-on:     #ff8a1f;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: #2a1810;
  color: var(--ink);
  font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight: 600;
  overflow: hidden;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font-family: inherit; font-weight: inherit; color: inherit; }

/* ===== Chassis (TR-808 enclosure) ===== */
.chassis {
  position: fixed;
  inset: 0;
  display: flex;
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  background:
    linear-gradient(90deg,
      var(--bg-wood) 0px, var(--bg-wood-light) 6px, var(--bg-wood) 12px,
      transparent 14px, transparent calc(100% - 14px),
      var(--bg-wood) calc(100% - 12px), var(--bg-wood-light) calc(100% - 6px), var(--bg-wood) 100%
    ),
    var(--bg-wood);
}
.chassis::before, .chassis::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 12px; pointer-events: none;
  background:
    repeating-linear-gradient(180deg,
      rgba(0,0,0,.18) 0 1px,
      transparent 1px 3px,
      rgba(0,0,0,.10) 3px 5px,
      transparent 5px 12px),
    linear-gradient(90deg, rgba(0,0,0,.5), rgba(0,0,0,0) 60%, rgba(0,0,0,.5));
}
.chassis::before { left: 0; }
.chassis::after { right: 0; }
.panel {
  flex: 1;
  min-width: 0;
  margin: 4px 12px;
  background:
    radial-gradient(1200px 600px at 30% 0%, rgba(255,255,255,.18), transparent 60%),
    radial-gradient(900px 500px at 80% 100%, rgba(0,0,0,.10), transparent 60%),
    var(--bg-panel);
  border: 1px solid var(--ink);
  border-radius: 4px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.25),
    inset 0 0 30px rgba(0,0,0,.10),
    0 6px 18px rgba(0,0,0,.5);
  display: grid;
  grid-template-rows: auto 1fr auto;
  position: relative;
  overflow: hidden;
}
.panel::after {
  /* faint paint grain */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    radial-gradient(rgba(0,0,0,.05) 1px, transparent 1px),
    radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 3px 3px, 5px 5px;
  background-position: 0 0, 1px 2px;
  mix-blend-mode: multiply;
  opacity: .35;
}

/* ===== Header bar ===== */
.header {
  display: flex; align-items: stretch;
  height: clamp(40px, 9vh, 56px);
  border-bottom: 1px solid var(--ink);
  background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,0));
  position: relative; z-index: 2;
}
.brand {
  background: var(--accent-red);
  color: var(--accent-white);
  padding: 0 10px;
  display: flex; align-items: center;
  border-right: 1px solid var(--ink);
  box-shadow: inset 0 -2px 0 var(--accent-red-d);
  flex: 0 0 auto;
}
.brand .model {
  font-size: clamp(11px, 1.5vw, 14px);
  letter-spacing: .04em;
  font-weight: 900;
  line-height: 1;
  font-style: italic;
}

.transport {
  display: flex; align-items: center; gap: 6px;
  padding: 0 8px;
  flex: 1;
  min-width: 0;
}
.btn {
  border: 1px solid var(--ink);
  background: linear-gradient(180deg, #efe2c2 0%, #c9b88f 100%);
  color: var(--ink);
  border-radius: 4px;
  padding: 0 10px;
  height: 70%;
  min-height: 26px;
  font-size: clamp(9px, 1.2vw, 12px);
  letter-spacing: .1em;
  font-weight: 800;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.6),
    inset 0 -2px 0 rgba(0,0,0,.15),
    0 1px 0 rgba(0,0,0,.25);
  transition: transform 30ms ease-out, box-shadow 30ms ease-out;
}
.btn:active { transform: translateY(1px) scale(.98); box-shadow: inset 0 2px 4px rgba(0,0,0,.3); }
.btn.play.active {
  background: linear-gradient(180deg, #e85b54 0%, #a8231e 100%);
  color: var(--accent-white);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.4),
    inset 0 -2px 0 rgba(0,0,0,.25),
    0 0 12px rgba(255,90,40,.55);
}

.bpm {
  display: flex; align-items: center; gap: 4px;
  margin-left: auto;
  flex: 0 0 auto;
}
.bpm .label { font-size: clamp(8px, 1vw, 10px); letter-spacing: .15em; color: var(--ink-soft); }
.display {
  background: var(--display-bg);
  color: var(--display-on);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-weight: 700;
  border: 1px solid #000;
  border-radius: 3px;
  padding: 3px 7px;
  min-width: 46px;
  width: 56px;
  text-align: center;
  font-size: clamp(12px, 1.8vw, 18px);
  letter-spacing: .06em;
  box-shadow:
    inset 0 0 8px rgba(255,138,31,.25),
    inset 0 1px 0 rgba(0,0,0,.6),
    0 0 6px rgba(255,138,31,.15);
  text-shadow: 0 0 6px rgba(255,138,31,.7);
  -webkit-appearance: none;
  appearance: none;
  -moz-appearance: textfield;
  outline: none;
  caret-color: var(--display-on);
}
input.display::-webkit-outer-spin-button,
input.display::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input.display:focus {
  box-shadow:
    inset 0 0 12px rgba(255,138,31,.45),
    inset 0 1px 0 rgba(0,0,0,.6),
    0 0 10px rgba(255,138,31,.4);
}
.bpm .step-btn {
  width: 26px; height: 26px; border-radius: 50%;
  padding: 0;
  font-size: 18px;
  line-height: 1;
  min-height: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
.btn.ctrl {
  font-size: clamp(8px, 1.1vw, 11px);
  padding: 0 8px;
  letter-spacing: .12em;
}

.step-leds {
  display: grid;
  grid-template-columns: repeat(16, 1fr);
  gap: 3px;
  padding: 0 8px;
  align-items: center;
  border-left: 1px solid var(--ink);
  background: linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,0));
  min-width: 0;
  flex: 0 0 clamp(140px, 26vw, 280px);
}
.step-leds .led {
  height: 8px;
  border-radius: 50%;
  background: var(--led-off);
  box-shadow: inset 0 1px 0 rgba(0,0,0,.4), inset 0 -1px 0 rgba(255,255,255,.05);
  transition: background 30ms, box-shadow 30ms;
}
.step-leds .led.on {
  background: var(--led-on);
  box-shadow: 0 0 8px var(--led-on), 0 0 16px rgba(255,138,31,.5), inset 0 -1px 0 rgba(0,0,0,.2);
}

/* ===== Grid ===== */
.grid-wrap {
  padding: 4px 6px;
  overflow: hidden;
  position: relative;
  z-index: 1;
  min-width: 0;
}
.grid {
  display: grid;
  grid-template-columns: clamp(56px, 9vw, 72px) repeat(16, minmax(0, 1fr));
  gap: 3px;
  height: 100%;
  min-width: 0;
}
.row-label {
  display: flex; align-items: center; justify-content: space-between;
  gap: 2px;
  padding: 0 3px;
  background: linear-gradient(180deg, #efe2c2 0%, #c9b88f 100%);
  border: 1px solid var(--ink);
  border-radius: 3px;
  font-size: clamp(8px, 1vw, 10px);
  letter-spacing: .08em;
  font-weight: 800;
  position: relative;
  min-width: 0;
  overflow: hidden;
}
.row-label .vname {
  background: var(--ink);
  color: var(--accent-white);
  padding: 1px 3px;
  border-radius: 2px;
  font-size: clamp(8px, 1vw, 9px);
  letter-spacing: .1em;
  flex: 0 0 auto;
}
.row-label .ms { display: flex; gap: 2px; flex: 0 0 auto; }
.row-label .ms button {
  width: clamp(14px, 2.2vw, 18px);
  height: clamp(14px, 2.2vw, 18px);
  border: 1px solid var(--ink);
  border-radius: 2px;
  background: linear-gradient(180deg, #efe2c2 0%, #c9b88f 100%);
  font-size: clamp(7px, 1vw, 9px); font-weight: 800;
  padding: 0;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
}
.row-label .ms .m.on { background: linear-gradient(180deg, #d6504a, #8c1f1b); color: var(--accent-white); }
.row-label .ms .s.on { background: linear-gradient(180deg, #f4d76a, #c79b1f); color: var(--ink); }

.cell {
  border: 1px solid var(--ink);
  border-radius: 4px;
  background: var(--bg-panel-dark);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.3),
    inset 0 -2px 0 rgba(0,0,0,.20);
  cursor: pointer;
  transition: background 30ms, box-shadow 30ms, transform 30ms;
  position: relative;
}
.cell:active { transform: scale(.94); }
.cell.on {
  background: linear-gradient(180deg, #f7a850 0%, var(--accent-orange) 70%, #b06a18 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -2px 0 rgba(0,0,0,.25),
    0 0 6px rgba(255,138,31,.35);
}
.cell.accent {
  background: linear-gradient(180deg, #e85b54 0%, var(--accent-red) 70%, #6e1612 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.55),
    inset 0 1px 0 rgba(255,255,255,.4),
    inset 0 -2px 0 rgba(0,0,0,.3),
    0 0 10px rgba(232,90,80,.5);
}
.cell.cur::after {
  content: ""; position: absolute; inset: -2px; border-radius: 6px;
  border: 2px solid rgba(255,255,255,.95);
  box-shadow:
    0 0 10px rgba(255,255,255,.55),
    0 0 4px rgba(255,220,170,.65),
    inset 0 0 6px rgba(255,255,255,.25);
  pointer-events: none;
}
/* TR-808 style 4-step group color bands (subtle tint on off-cells) */
.cell.grp-a { background-color: #cfa874; }
.cell.grp-b { background-color: #d8c074; }
.cell.grp-c { background-color: #d8cba2; }
.cell.grp-d { background-color: #c88078; }
.cell.grp-a.on, .cell.grp-b.on, .cell.grp-c.on, .cell.grp-d.on {
  background: linear-gradient(180deg, #f7a850 0%, var(--accent-orange) 70%, #b06a18 100%);
}
.cell.grp-a.accent, .cell.grp-b.accent, .cell.grp-c.accent, .cell.grp-d.accent {
  background: linear-gradient(180deg, #e85b54 0%, var(--accent-red) 70%, #6e1612 100%);
}

/* ===== FX strip ===== */
.fx {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 8px;
  padding: 6px 8px;
  border-top: 1px solid var(--ink);
  background:
    linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,0)),
    var(--bg-panel-dark);
  position: relative; z-index: 2;
  align-items: stretch;
  min-width: 0;
}
.fill-btn {
  display: flex; align-items: center; justify-content: center;
  font-family: inherit;
  font-size: clamp(10px, 1.3vw, 13px);
  letter-spacing: .14em;
  font-weight: 900;
  text-transform: uppercase;
  line-height: 1.05;
  color: var(--accent-white);
  background: linear-gradient(180deg, #e85b54 0%, var(--accent-red) 60%, #8c1f1b 100%);
  border: 1px solid var(--ink);
  border-radius: 6px;
  padding: 0 12px;
  min-width: 60px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  text-shadow: 0 1px 0 rgba(0,0,0,.35);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -2px 0 rgba(0,0,0,.30),
    0 1px 0 rgba(0,0,0,.30);
  transition: transform 30ms ease-out, box-shadow 30ms ease-out;
}
.fill-btn.holding {
  background: linear-gradient(180deg, #ffb066 0%, var(--accent-orange) 60%, #a85e10 100%);
  color: var(--display-bg);
  text-shadow: none;
  box-shadow:
    inset 0 2px 4px rgba(0,0,0,.35),
    inset 0 -1px 0 rgba(255,255,255,.25),
    0 0 14px rgba(255,138,31,.7);
  transform: translateY(1px);
}
.fx-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 4px 14px;
  min-width: 0;
  align-items: center;
}
.slider {
  display: grid;
  grid-template-columns: clamp(36px, 5vw, 50px) 1fr auto;
  align-items: center;
  gap: 5px;
  min-width: 0;
}
.fx-reset {
  width: 22px; height: 22px;
  border: 1px solid var(--ink);
  border-radius: 4px;
  background: linear-gradient(180deg, #efe2c2 0%, #c9b88f 100%);
  color: var(--ink);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 14px;
  font-weight: 700;
  line-height: 1;
  padding: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.6),
    inset 0 -2px 0 rgba(0,0,0,.18),
    0 1px 0 rgba(0,0,0,.25);
  flex: 0 0 auto;
  user-select: none;
}
.fx-reset:active { transform: translateY(1px) scale(.96); box-shadow: inset 0 2px 4px rgba(0,0,0,.3); }
/* Effects-snap visual cue: orange glow on the thumb + label tint while
   pendingFx differs from liveFx for this slider. */
.slider.pending .lbl { color: var(--accent-red); }
.slider.pending input[type=range]::-webkit-slider-thumb {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.7),
    inset 0 -1px 0 rgba(0,0,0,.25),
    0 0 8px var(--accent-orange),
    0 0 14px rgba(255,138,31,.45);
}
.slider.pending input[type=range]::-moz-range-thumb {
  box-shadow: 0 0 8px var(--accent-orange);
}
.slider .lbl {
  font-size: clamp(8px, 1.1vw, 10px);
  letter-spacing: .08em;
  color: var(--ink);
  text-transform: uppercase;
  text-align: right;
  white-space: nowrap;
  font-weight: 800;
}
.slider input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  min-width: 0;
  height: 26px;
  background: transparent;
  margin: 0;
  cursor: pointer;
  touch-action: pan-x;
}
.slider input[type=range]::-webkit-slider-runnable-track {
  height: 8px;
  background: linear-gradient(180deg, #2a1d10 0%, #4a3a28 100%);
  border: 1px solid var(--ink);
  border-radius: 2px;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.6);
}
.slider input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 22px; height: 18px;
  background:
    linear-gradient(180deg, transparent 0 7px, var(--accent-red) 7px 11px, transparent 11px 18px),
    linear-gradient(180deg, #f7eccb 0%, #d6c293 50%, #a99060 100%);
  border: 1px solid var(--ink);
  border-radius: 3px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.7),
    inset 0 -1px 0 rgba(0,0,0,.25),
    0 1px 2px rgba(0,0,0,.4);
  margin-top: -6px;
}
.slider input[type=range]::-moz-range-track {
  height: 8px;
  background: linear-gradient(180deg, #2a1d10, #4a3a28);
  border: 1px solid var(--ink);
  border-radius: 2px;
}
.slider input[type=range]::-moz-range-thumb {
  width: 22px; height: 18px;
  background:
    linear-gradient(180deg, transparent 0 7px, var(--accent-red) 7px 11px, transparent 11px 18px),
    linear-gradient(180deg, #f7eccb 0%, #d6c293 50%, #a99060 100%);
  border: 1px solid var(--ink);
  border-radius: 3px;
}

/* ===== Right-side machine toggle (single button shows destination) ===== */
.page-nav {
  display: flex;
  border-left: 1px solid var(--ink);
  padding-left: 8px;
  align-self: stretch;
  align-items: center;
}
.page-btn {
  border: 1px solid var(--ink);
  border-radius: 6px;
  background: linear-gradient(180deg, #2a1d10, #4a3a28);
  color: var(--display-on);
  padding: 8px 14px;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: clamp(13px, 1.8vw, 18px);
  font-weight: 900;
  letter-spacing: .12em;
  cursor: pointer;
  min-width: 56px;
  height: 100%;
  text-shadow: 0 0 6px rgba(255,138,31,.7);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.15),
    inset 0 -2px 0 rgba(0,0,0,.4),
    inset 0 0 8px rgba(255,138,31,.18),
    0 1px 0 rgba(0,0,0,.25);
  transition: transform 30ms ease-out, box-shadow 30ms ease-out;
}
.page-btn:active { transform: translateY(1px) scale(.98); }

/* ===== Orientation guard ===== */
.rotate-hint {
  display: none;
  position: fixed; inset: 0;
  background: #1a0f06;
  color: var(--accent-white);
  z-index: 999;
  align-items: center; justify-content: center;
  text-align: center; padding: 24px;
  font-size: 16px; letter-spacing: .1em;
}
.rotate-hint .icon {
  display: block; font-size: 64px; margin-bottom: 12px;
  transform: rotate(90deg);
}
@media (orientation: portrait) and (max-width: 900px) {
  .rotate-hint { display: flex; }
}

/* ===== Tap to start overlay ===== */
.boot {
  position: fixed; inset: 0;
  background: rgba(20,12,5,.85);
  z-index: 998;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent-white);
  letter-spacing: .15em;
  font-size: 14px;
  text-align: center;
  flex-direction: column;
  gap: 8px;
  cursor: pointer;
}
.boot.hidden { display: none; }
.boot .big {
  font-size: 22px;
  color: var(--accent-orange);
  text-shadow: 0 0 12px rgba(255,138,31,.6);
  letter-spacing: .3em;
}

/* ===== Options overlay — neutral system modal =====
   Intentionally NOT in the 808 cream/red language so the same screen
   harmonises with the 303 silver/orange and a future MS-20-style black
   panel. Dark surface, restrained accent, sans-serif typography. */
.options-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.62);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  z-index: 990;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  font-family: -apple-system, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  color: #e8e8ea;
}
.options-overlay.hidden { display: none; }
.options-card {
  background: #1c1c20;
  border: 1px solid #3a3a40;
  border-radius: 10px;
  padding: 14px 18px 16px;
  min-width: min(560px, 92vw);
  max-width: 680px;
  max-height: 92vh;
  overflow: auto;
  box-shadow: 0 12px 40px rgba(0,0,0,.55);
  color: inherit;
}
.opt-head {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid #2a2a30;
  padding-bottom: 10px; margin-bottom: 12px;
}
.opt-title {
  font-weight: 600; letter-spacing: .22em; font-size: 13px;
  color: #f0f0f2;
  text-transform: uppercase;
}
.opt-section { margin: 14px 0; }
.opt-section:first-of-type { margin-top: 6px; }
.opt-label {
  font-size: 10px; letter-spacing: .14em; font-weight: 500;
  margin-bottom: 8px; text-transform: uppercase;
  color: #8c8c92;
}
.opt-row {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px;
}

/* Override the 808-themed .btn / .ctrl styles inside the modal */
.options-overlay .btn,
.options-overlay .btn.ctrl {
  background: #2a2a30;
  color: #d8d8da;
  border: 1px solid #45454c;
  border-radius: 6px;
  font-family: inherit;
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: none;
  text-shadow: none;
  box-shadow: none;
  padding: 6px 12px;
  min-height: 32px;
  transition: background 60ms ease-out, color 60ms ease-out, transform 60ms ease-out;
}
.options-overlay .opt-row .btn { flex: 1 1 auto; min-width: 56px; }
.options-overlay .btn:hover  { background: #34343a; }
.options-overlay .btn:active { background: #15151a; transform: translateY(1px); }
.options-overlay .btn.active {
  background: #e8e8ea;
  color: #18181b;
  border-color: #e8e8ea;
  font-weight: 600;
}
.opt-status {
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color: #c8c8d0;
  background: #0e0e10;
  padding: 4px 10px;
  display: inline-block;
  border-radius: 4px;
  margin-top: 4px;
  font-size: 12px;
  border: 1px solid #2a2a30;
  letter-spacing: .05em;
}
.opt-hint {
  font-size: 11px; color: #6c6c72; margin-top: 6px;
  letter-spacing: .02em; font-weight: 400;
}
.opt-slider {
  display: grid !important;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 10px;
}
.opt-slider .lbl {
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  color: #8c8c92;
  letter-spacing: .05em;
  text-transform: uppercase;
  text-align: right;
}
.opt-slider .lbl.rt { text-align: left; }
/* Neutral slider (overrides the cream 808 thumb) */
.opt-slider input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 28px;
  background: transparent;
  margin: 0; cursor: pointer;
  touch-action: pan-x;
}
.opt-slider input[type=range]::-webkit-slider-runnable-track {
  height: 4px;
  background: #2a2a30;
  border: 1px solid #45454c;
  border-radius: 2px;
  box-shadow: none;
}
.opt-slider input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px;
  background: #e8e8ea;
  border: 1px solid #45454c;
  border-radius: 50%;
  box-shadow: 0 1px 3px rgba(0,0,0,.5);
  margin-top: -8px;
}
.opt-slider input[type=range]::-moz-range-track {
  height: 4px; background: #2a2a30; border: 1px solid #45454c; border-radius: 2px;
}
.opt-slider input[type=range]::-moz-range-thumb {
  width: 18px; height: 18px; background: #e8e8ea;
  border: 1px solid #45454c; border-radius: 50%;
}
.opt-foot {
  border-top: 1px solid #2a2a30;
  padding-top: 12px; margin-top: 14px;
  display: flex; justify-content: flex-end;
}

/* Pending edits visual marker (snap-to-loop mode) */
.cell.pending {
  outline: 2px dashed var(--accent-orange);
  outline-offset: -3px;
  animation: pendingPulse 1.5s ease-in-out infinite;
}
.row-label .ms button.pending {
  position: relative;
  animation: pendingPulse 1.5s ease-in-out infinite;
}
.row-label .ms button.pending::after {
  content: ""; position: absolute; top: 2px; right: 2px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent-orange);
  box-shadow: 0 0 4px var(--accent-orange);
  pointer-events: none;
}
@keyframes pendingPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,138,31,0); }
  50%      { box-shadow: 0 0 0 2px rgba(255,138,31,.55); }
}

/* Tap acknowledgement: every interactive element flashes briefly on press
   so even no-op taps (e.g. STOP while already stopped) feel acknowledged.
   filter: brightness keeps this orthogonal to existing box-shadow / outline
   / ::after / transform effects, so it composes without visual conflicts. */
@keyframes ackTap {
  0%   { filter: brightness(1.40); }
  60%  { filter: brightness(1.15); }
  100% { filter: brightness(1.00); }
}
.ack-flash { animation: ackTap 180ms ease-out; }

/* Tighter layout for short screens */
@media (max-height: 380px) {
  .panel { margin: 4px 22px; }
  .grid-wrap { padding: 4px 8px; }
  .fx { padding: 6px 10px; gap: 8px; }
}

<script>
"use strict";

/* ====================================================================
   AudioWorklet processor sources (loaded via Blob URL so file:// works)
   ==================================================================== */

const LADDER_PROCESSOR_SRC = `
class LadderProcessor extends AudioWorkletProcessor {
  static get parameterDescriptors() {
    return [
      { name: 'cutoff',    defaultValue: 20000, minValue: 30, maxValue: 22000, automationRate: 'a-rate' },
      { name: 'resonance', defaultValue: 0,     minValue: 0,  maxValue: 1.2,   automationRate: 'a-rate' },
      { name: 'drive',     defaultValue: 0,     minValue: 0,  maxValue: 1,     automationRate: 'a-rate' }
    ];
  }
  constructor() {
    super();
    // 4-stage 1-pole LP states for L and R, internal 2x sample rate
    this._sL = [0,0,0,0]; this._sR = [0,0,0,0];
    this._zL = 0; this._zR = 0;     // feedback last sample
  }
  // soft clip
  _tanh(x){ const a = Math.abs(x); if (a < 3) { const x2 = x*x; return x*(27+x2)/(27+9*x2); } return x>0?1:-1; }
  _processChan(x, state, fbPrev, k, alpha, drive) {
    // input + nonlinear feedback
    let inp = x - k * this._tanh(fbPrev);
    inp = this._tanh(inp * (1 + drive*4));
    let s0 = state[0] + alpha * (inp        - state[0]);
    let s1 = state[1] + alpha * (this._tanh(s0) - state[1]);
    let s2 = state[2] + alpha * (s1         - state[2]);
    let s3 = state[3] + alpha * (s2         - state[3]);
    state[0]=s0; state[1]=s1; state[2]=s2; state[3]=s3;
    return s3;
  }
  process(inputs, outputs, params) {
    const inp = inputs[0]; const out = outputs[0];
    if (!inp || inp.length === 0) return true;
    const ch = Math.min(inp.length, out.length);
    const n = out[0].length;
    const cutoffArr = params.cutoff;
    const resoArr   = params.resonance;
    const driveArr  = params.drive;
    const sr2 = sampleRate * 2;
    for (let i = 0; i < n; i++) {
      const cutoff = cutoffArr.length>1 ? cutoffArr[i] : cutoffArr[0];
      const reso   = resoArr.length>1   ? resoArr[i]   : resoArr[0];
      const drive  = driveArr.length>1  ? driveArr[i]  : driveArr[0];
      // 1-pole alpha for 2x rate
      const wd = 2 * Math.PI * Math.min(cutoff, sr2*0.45);
      const T = 1/sr2;
      const alpha = wd*T / (1 + wd*T);
      const k = reso * 4.0;
      for (let c = 0; c < ch; c++) {
        const x = inp[c][i];
        const state = c === 0 ? this._sL : this._sR;
        let fb = c === 0 ? this._zL : this._zR;
        // 2x oversample: process twice, take last
        let y = this._processChan(x, state, fb, k, alpha, drive);
        y = this._processChan(x, state, y,  k, alpha, drive);
        if (c === 0) this._zL = y; else this._zR = y;
        // soft limit
        out[c][i] = this._tanh(y * 1.05);
      }
    }
    return true;
  }
}
registerProcessor('ladder', LadderProcessor);
`;

const SAT_PROCESSOR_SRC = `
class SatProcessor extends AudioWorkletProcessor {
  static get parameterDescriptors() {
    return [{ name: 'drive', defaultValue: 0, minValue: 0, maxValue: 1, automationRate: 'k-rate' }];
  }
  constructor(){ super(); this._zL = 0; this._zR = 0; this._yL = 0; this._yR = 0; }
  _tanh(x){ const a = Math.abs(x); if (a < 3) { const x2 = x*x; return x*(27+x2)/(27+9*x2); } return x>0?1:-1; }
  _stage(x, prev, drive){
    // 2x upsample + tanh + downsample. Drive curve is gentle: at drive=1
    // peak gain is ~5x (≈14dB), at drive=0 it's unity.
    const up0 = (prev + x) * 0.5;
    const up1 = x;
    const g = 1 + drive * 4;
    const s0 = this._tanh(up0 * g);
    const s1 = this._tanh(up1 * g);
    return (s0 + s1) * 0.5;
  }
  process(inputs, outputs, params) {
    const inp = inputs[0]; const out = outputs[0];
    if (!inp || inp.length === 0) return true;
    const drive = params.drive[0];
    const makeup = 1 / (1 + drive * 1.3);
    const n = out[0].length;
    const ch = Math.min(inp.length, out.length);
    for (let c = 0; c < ch; c++) {
      const xi = inp[c]; const yo = out[c];
      let prev = c === 0 ? this._zL : this._zR;
      for (let i = 0; i < n; i++) {
        const x = xi[i];
        const y = this._stage(x, prev, drive);
        prev = x;
        yo[i] = y * makeup;
      }
      if (c === 0) this._zL = prev; else this._zR = prev;
    }
    return true;
  }
}
registerProcessor('sat', SatProcessor);
`;

/* ====================================================================
   Audio engine
   ==================================================================== */

const VOICE_NAMES = ['BD','SD','CH','OH','CP','CB','CY'];
const N_VOICES = VOICE_NAMES.length;
const N_STEPS  = 16;

let ctx = null;
let master = null;     // master bus object
let voices = null;     // { bd, sd, ch, oh, cp, cb, cy }
let workletReady = false;
let workletSupported = true;

async function ensureAudio() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC({ latencyHint: 'interactive' });
    // iOS Safari requires resume() to fire from within the user gesture call stack
    // BEFORE we hit any awaits — kick it synchronously and ignore the returned promise.
    try { ctx.resume(); } catch(_) {}
    if (!ctx.audioWorklet) { workletSupported = false; }
    if (workletSupported) {
      try {
        const blob = new Blob([LADDER_PROCESSOR_SRC + '\n' + SAT_PROCESSOR_SRC], { type: 'application/javascript' });
        await ctx.audioWorklet.addModule(URL.createObjectURL(blob));
        workletReady = true;
      } catch (e) {
        console.warn('AudioWorklet load failed, falling back', e);
        workletReady = false;
      }
    }
    master = buildMasterBus(ctx);
    voices = createVoices(ctx, master.input);
    master.setReso(options.resonance);
    master.setDelayTime(delaySecondsFromOptions(bpm));
    window.__rhythmMachine = { ctx, master, voices };
  }
  if (ctx.state === 'suspended') await ctx.resume();
}

/* ---------------- master bus ---------------- */

function buildMasterBus(ctx) {
  // input (voice sum + future bass)
  const input = ctx.createGain(); input.gain.value = 1.0;

  // saturation
  let sat;
  if (workletReady) {
    sat = new AudioWorkletNode(ctx, 'sat', { numberOfInputs:1, numberOfOutputs:1, outputChannelCount:[2] });
  } else {
    sat = ctx.createWaveShaper();
    sat.curve = makeTanhCurve(0);
    sat.oversample = '4x';
  }

  // 4-pole ladder filter
  let filter;
  if (workletReady) {
    filter = new AudioWorkletNode(ctx, 'ladder', { numberOfInputs:1, numberOfOutputs:1, outputChannelCount:[2] });
  } else {
    // fallback: 2 biquads in series + waveshaper
    const b1 = ctx.createBiquadFilter(); b1.type='lowpass'; b1.frequency.value=20000; b1.Q.value=0.5;
    const b2 = ctx.createBiquadFilter(); b2.type='lowpass'; b2.frequency.value=20000; b2.Q.value=0.5;
    const ws = ctx.createWaveShaper(); ws.curve = makeTanhCurve(0); ws.oversample='2x';
    b1.connect(ws).connect(b2);
    filter = { _b1:b1, _b2:b2, _ws:ws, _in:b1, _out:b2 };
    filter.connect = (n) => b2.connect(n);
    filter.disconnect = () => b2.disconnect();
  }

  // dry path + sends
  const dryGain = ctx.createGain(); dryGain.gain.value = 1.0;

  // delay
  const dlySend = ctx.createGain(); dlySend.gain.value = 0;
  const delay   = ctx.createDelay(2.0); delay.delayTime.value = 0.25;
  const fb      = ctx.createGain(); fb.gain.value = 0.4;
  const dlyRet  = ctx.createGain(); dlyRet.gain.value = 1.0;
  dlySend.connect(delay);
  delay.connect(fb).connect(delay);
  delay.connect(dlyRet);

  // reverb
  const revSend = ctx.createGain(); revSend.gain.value = 0;
  const conv    = ctx.createConvolver();
  conv.buffer = makeIR(ctx, 2.0, 0.04);
  const revRet  = ctx.createGain(); revRet.gain.value = 1.0;
  revSend.connect(conv).connect(revRet);

  // master out
  const out = ctx.createGain(); out.gain.value = 0.9;
  out.connect(ctx.destination);

  // routing
  input.connect(sat);
  if (filter._in) sat.connect(filter._in); else sat.connect(filter);
  // filter output → 3 paths
  if (filter._out) {
    filter._out.connect(dryGain);
    filter._out.connect(dlySend);
    filter._out.connect(revSend);
  } else {
    filter.connect(dryGain);
    filter.connect(dlySend);
    filter.connect(revSend);
  }
  dryGain.connect(out);
  dlyRet.connect(out);
  revRet.connect(out);

  // Filter internal drive is fixed (gentle coloration). Resonance is set
  // dynamically via setReso() — Options screen exposes it 0..1 (mapped to
  // filter resonance 0..1.15; >1 = self-oscillation in the Moog ladder).
  const FIXED_FILTER_DRIVE = 0.18;
  if (workletReady) {
    filter.parameters.get('drive').setValueAtTime(FIXED_FILTER_DRIVE, ctx.currentTime);
  } else {
    filter._ws.curve = makeTanhCurve(FIXED_FILTER_DRIVE * 0.7);
  }

  // public API
  const setDrive = (v01) => {
    const v = Math.max(0, Math.min(1, v01));
    if (workletReady) {
      sat.parameters.get('drive').setTargetAtTime(v, ctx.currentTime, 0.02);
    } else {
      sat.curve = makeTanhCurve(v);
    }
  };
  const setCutoff = (hz) => {
    const v = Math.max(30, Math.min(20000, hz));
    if (workletReady) {
      filter.parameters.get('cutoff').setTargetAtTime(v, ctx.currentTime, 0.02);
    } else {
      filter._b1.frequency.setTargetAtTime(v, ctx.currentTime, 0.02);
      filter._b2.frequency.setTargetAtTime(v, ctx.currentTime, 0.02);
    }
  };
  const setReso = (v01) => {
    // slider 0..1 → filter resonance 0..1.15 (worklet k = reso*4 oscillates
    // around k≈4.0, so values > 1.0 push into aggressive self-oscillation)
    const r = Math.max(0, Math.min(1.2, v01 * 1.15));
    if (workletReady) {
      filter.parameters.get('resonance').setTargetAtTime(r, ctx.currentTime, 0.03);
    } else {
      const Q = 0.5 + r * 14;
      filter._b1.Q.setTargetAtTime(Q, ctx.currentTime, 0.03);
      filter._b2.Q.setTargetAtTime(Q, ctx.currentTime, 0.03);
    }
  };
  // Combined delay knob: a single slider controls both send/mix and feedback,
  // shaped so 0 = bypass and 1 = lush near-runaway tail without diverging.
  const setDelay = (v01) => {
    const v = Math.max(0, Math.min(1, v01));
    const mix = v * 0.75;          // dry/wet send
    const feedback = v * 0.78;     // capped well below the 0.92 divergence limit
    dlySend.gain.setTargetAtTime(mix, ctx.currentTime, 0.02);
    fb.gain.setTargetAtTime(feedback, ctx.currentTime, 0.02);
  };
  const setDelayTime = (sec) => {
    delay.delayTime.setTargetAtTime(Math.max(0.01, Math.min(2.0, sec)), ctx.currentTime, 0.02);
  };
  const setReverb = (v01) => {
    revSend.gain.setTargetAtTime(Math.max(0, Math.min(1, v01)) * 0.9, ctx.currentTime, 0.02);
  };

  return {
    input, output: out,
    setDrive, setCutoff, setReso, setDelay, setDelayTime, setReverb
  };
}

function makeTanhCurve(drive) {
  const N = 4096;
  const c = new Float32Array(N);
  const g = 1 + drive * 9;
  for (let i = 0; i < N; i++) {
    const x = (i / (N-1)) * 2 - 1;
    c[i] = Math.tanh(x * g) / Math.tanh(g);
  }
  return c;
}

function makeIR(ctx, durSec, erEnd) {
  const sr = ctx.sampleRate;
  const len = Math.floor(sr * durSec);
  const buf = ctx.createBuffer(2, len, sr);
  const erTaps = [
    [0.007, 0.65], [0.013, -0.5], [0.019, 0.45], [0.027, -0.4],
    [0.034, 0.32], [0.041, -0.28]
  ];
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    // early reflections (channel-decorrelated by tap polarity flip)
    for (const [t, g] of erTaps) {
      const idx = Math.floor(t * sr);
      if (idx < len) d[idx] += (c === 0 ? g : -g);
    }
    // late exponential noise tail, channel-decorrelated by independent random
    const tailStart = Math.floor(erEnd * sr);
    for (let i = tailStart; i < len; i++) {
      const t = (i - tailStart) / (len - tailStart);
      const env = Math.pow(1 - t, 2.2);
      // light HP via simple difference + low-pass-ish smoothing
      d[i] += (Math.random()*2 - 1) * env * 0.6;
    }
    // gentle low-pass smoothing to darken
    let prev = 0;
    for (let i = 0; i < len; i++) {
      const y = prev * 0.55 + d[i] * 0.45;
      prev = y; d[i] = y;
    }
  }
  return buf;
}

/* ---------------- voices ---------------- */

function createVoices(ctx, dest) {
  // shared metal cluster periodic wave (band-limited)
  const metalFreqs = [205, 304, 369, 522, 540, 800];
  const baseHz = 100; // reference for PeriodicWave construction
  // We'll just create 6 oscillators per hit (cheap), no need for PeriodicWave here
  // since the cluster is 6 different fundamentals (not harmonics of one).

  function envGain(time, peak, attack, decay) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(peak, time + attack);
    g.gain.exponentialRampToValueAtTime(Math.max(peak * 0.0001, 0.0001), time + attack + decay);
    return g;
  }

  function noiseBuffer(len) {
    const b = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
    return b;
  }
  const NOISE_BUF = noiseBuffer(Math.floor(ctx.sampleRate * 2)); // 2 sec loopable noise

  function noiseSource(time, dur) {
    const s = ctx.createBufferSource();
    s.buffer = NOISE_BUF;
    s.loop = true;
    s.loopEnd = NOISE_BUF.duration;
    // randomize start offset
    s.start(time, Math.random() * (NOISE_BUF.duration - dur - 0.1));
    s.stop(time + dur + 0.05);
    return s;
  }

  // ------- BD -------
  function bd(time, accent) {
    const peak = accent ? 1.3 : 0.95;
    const osc = ctx.createOscillator(); osc.type = 'sine';
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(55, time + 0.04);
    const env = ctx.createGain();
    env.gain.setValueAtTime(peak, time);
    env.gain.exponentialRampToValueAtTime(0.0005, time + 0.55);
    osc.connect(env).connect(dest);
    osc.start(time); osc.stop(time + 0.6);

    // click
    const n = noiseSource(time, 0.01);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;
    const cg = envGain(time, accent ? 0.45 : 0.3, 0.0005, 0.005);
    n.connect(hp).connect(cg).connect(dest);
  }

  // ------- SD -------
  function sd(time, accent) {
    const peak = accent ? 1.0 : 0.7;
    // two-tone tom (180Hz + 330Hz triangles)
    const t1 = ctx.createOscillator(); t1.type = 'triangle'; t1.frequency.value = 180;
    const t2 = ctx.createOscillator(); t2.type = 'triangle'; t2.frequency.value = 330;
    const tg = ctx.createGain(); tg.gain.setValueAtTime(peak * 0.55, time);
    tg.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
    t1.connect(tg); t2.connect(tg); tg.connect(dest);
    t1.start(time); t2.start(time); t1.stop(time + 0.2); t2.stop(time + 0.2);

    // noise
    const n = noiseSource(time, 0.22);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 1.2;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 400;
    const ng = ctx.createGain();
    const snappy = accent ? 0.7 : 0.5;
    ng.gain.setValueAtTime(snappy, time);
    ng.gain.exponentialRampToValueAtTime(0.001, time + 0.22);
    n.connect(hp).connect(bp).connect(ng).connect(dest);
  }

  // ------- metal cluster generator (shared by CH/OH/CY) -------
  function metalCluster(time, dur, peak, hpHz, bpHz, bpQ) {
    const oscs = [];
    const merge = ctx.createGain(); merge.gain.value = 0.18;
    for (const f of metalFreqs) {
      const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = f;
      o.connect(merge);
      o.start(time); o.stop(time + dur + 0.05);
      oscs.push(o);
    }
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = bpHz; bp.Q.value = bpQ;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = hpHz;
    const env = ctx.createGain();
    env.gain.setValueAtTime(peak, time);
    env.gain.exponentialRampToValueAtTime(0.0008, time + dur);
    merge.connect(bp).connect(hp).connect(env);
    return env;
  }

  // CH/OH choke: keep track of currently scheduled OH so CH can cancel it
  let pendingOH = null;
  function ch(time, accent) {
    const peak = accent ? 1.0 : 0.7;
    const env = metalCluster(time, 0.06, peak, 7000, 8000, 1.2);
    env.connect(dest);
    // choke any open hat envelope: cancel its tail and let it decay fast
    if (pendingOH) {
      const g = pendingOH.env.gain;
      try {
        g.cancelScheduledValues(time);
        g.setTargetAtTime(0, time, 0.004);
      } catch(_) {}
      pendingOH = null;
    }
  }
  function oh(time, accent) {
    const peak = accent ? 0.95 : 0.65;
    const env = metalCluster(time, 2.2, peak, 7000, 8000, 1.0);
    env.connect(dest);
    pendingOH = { env, time };
  }

  // ------- CP -------
  function cp(time, accent) {
    const peak = accent ? 1.1 : 0.85;
    const bursts = [0.0, 0.012, 0.024];
    for (const off of bursts) {
      const n = noiseSource(time + off, 0.012);
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1200; bp.Q.value = 1.5;
      const g = ctx.createGain();
      g.gain.setValueAtTime(peak * 0.9, time + off);
      g.gain.exponentialRampToValueAtTime(0.001, time + off + 0.014);
      n.connect(bp).connect(g).connect(dest);
    }
    // tail
    const nt = noiseSource(time + 0.036, 0.12);
    const bpt = ctx.createBiquadFilter(); bpt.type = 'bandpass'; bpt.frequency.value = 1100; bpt.Q.value = 1.0;
    const gt = ctx.createGain();
    gt.gain.setValueAtTime(peak * 0.55, time + 0.036);
    gt.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
    nt.connect(bpt).connect(gt).connect(dest);
  }

  // ------- CB -------
  function cb(time, accent) {
    const peak = accent ? 1.0 : 0.7;
    const a = ctx.createOscillator(); a.type = 'square'; a.frequency.value = 540;
    const b = ctx.createOscillator(); b.type = 'square'; b.frequency.value = 800;
    const mix = ctx.createGain(); mix.gain.value = 0.22;
    a.connect(mix); b.connect(mix);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 1.5;
    const env = ctx.createGain();
    env.gain.setValueAtTime(peak, time);
    env.gain.exponentialRampToValueAtTime(0.0008, time + 0.22);
    mix.connect(bp).connect(env).connect(dest);
    a.start(time); b.start(time); a.stop(time + 0.25); b.stop(time + 0.25);
  }

  // ------- CY -------
  function cy(time, accent) {
    const peak = accent ? 0.85 : 0.6;
    const env = metalCluster(time, 1.4, peak, 5000, 7200, 0.9);
    // extra HP
    const hp2 = ctx.createBiquadFilter(); hp2.type = 'highpass'; hp2.frequency.value = 4000;
    env.connect(hp2).connect(dest);
    // noise sparkle
    const n = noiseSource(time, 1.0);
    const nbp = ctx.createBiquadFilter(); nbp.type = 'bandpass'; nbp.frequency.value = 9000; nbp.Q.value = 1.0;
    const nh  = ctx.createBiquadFilter(); nh.type='highpass'; nh.frequency.value = 6000;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(peak * 0.45, time);
    ng.gain.exponentialRampToValueAtTime(0.0008, time + 1.2);
    n.connect(nh).connect(nbp).connect(ng).connect(dest);
  }

  return [bd, sd, ch, oh, cp, cb, cy];
}

/* ====================================================================
   Pattern data & state
   ==================================================================== */

const pattern = new Uint8Array(N_VOICES * N_STEPS); // 0=off, 1=on, 2=accent (audio truth)
const muted   = new Array(N_VOICES).fill(false);
const soloed  = new Array(N_VOICES).fill(false);

// Pending mirrors. When the relevant per-category snap flag is off these
// stay in lockstep with the live arrays. When on, edits in that category
// go to pending only and are committed when the sequencer wraps to step 0.
const pendingPattern = new Uint8Array(N_VOICES * N_STEPS);
const pendingMuted   = new Array(N_VOICES).fill(false);
const pendingSoloed  = new Array(N_VOICES).fill(false);
let hasPending = false;

/* ----- Options (driven by the Options overlay) ----- */
const DEFAULTS = {
  delayDenom: 8, delayDotted: true,
  resonance: 0.5,
  // Snap-to-loop-start is set per category. Notes & Tracks default to
  // snap=on for musical-bar editing; Effects default to snap=off so
  // sweeps and filter twiddles feel responsive.
  snapNotes: true,
  snapTracks: true,
  snapEffects: false,
};
const options = { ...DEFAULTS };

/* ----- FX state (live = currently audible, pending = waiting for bar) ----- */
const FX_NAMES = ['drive','cutoff','delay','reverb'];
const FX_DEFAULTS = { drive: 0, cutoff: 1000, delay: 0, reverb: 0 };  // slider scale 0..1000
const liveFx    = { ...FX_DEFAULTS };
const pendingFx = { ...FX_DEFAULTS };
const FX_ELEMENTS = {};   // populated by bindFX()

function delaySecondsFromOptions(bpmVal) {
  const sixteenth = (60 / bpmVal) / 4;
  const stepsPerNote = 16 / options.delayDenom;  // 1/1=16, 1/2=8, 1/4=4, 1/8=2, 1/16=1
  const factor = options.delayDotted ? 1.5 : 1.0;
  return Math.max(0.01, Math.min(2.0, sixteenth * stepsPerNote * factor));
}

const pIdx = (v, s) => v * N_STEPS + s;
// VOICE_NAMES = ['BD','SD','CH','OH','CP','CB','CY'] → CH=2, OH=3
const CH_IDX = 2, OH_IDX = 3;

function cycleCellOn(arr, v, s) {
  const i = pIdx(v, s);
  arr[i] = (arr[i] + 1) % 3;
  // CH and OH are exclusive at the same step: turning one ON clears the other.
  let partnerCleared = -1;
  if (arr[i] !== 0 && (v === CH_IDX || v === OH_IDX)) {
    const partner = v === CH_IDX ? OH_IDX : CH_IDX;
    const pi = pIdx(partner, s);
    if (arr[pi] !== 0) {
      arr[pi] = 0;
      partnerCleared = partner;
    }
  }
  return { state: arr[i], partnerCleared };
}

const cellPending = (v, s) => pendingPattern[pIdx(v, s)] !== pattern[pIdx(v, s)];
const msPending   = (v) => pendingMuted[v] !== muted[v] || pendingSoloed[v] !== soloed[v];

function recomputeHasPending() {
  for (let i = 0; i < pattern.length; i++) {
    if (pendingPattern[i] !== pattern[i]) { hasPending = true; return; }
  }
  for (let v = 0; v < N_VOICES; v++) {
    if (pendingMuted[v] !== muted[v] || pendingSoloed[v] !== soloed[v]) {
      hasPending = true; return;
    }
  }
  for (const name of FX_NAMES) {
    if (pendingFx[name] !== liveFx[name]) { hasPending = true; return; }
  }
  hasPending = false;
}

function isAudible(v) {
  const anySolo = soloed.some(Boolean);
  return anySolo ? (soloed[v] && !muted[v]) : !muted[v];
}

/* ====================================================================
   Sequencer (Chris Wilson lookahead)
   ==================================================================== */

let bpm = 120;
let isPlaying = false;
let currentStep = 0;
let nextNoteTime = 0;
let schedTimer = null;
const SCHEDULE_AHEAD = 0.10;
const LOOKAHEAD_MS = 25;
const visualQueue = []; // {step, time}

// Fill-in state. While `fillActive`, the scheduler still advances normal
// step bookkeeping (so the loop position is preserved), but every
// 16th-note slot triggers `fillStep`'s notes instead of the live step.
let fillActive = false;
let fillStep = 0;
let currentAudibleStep = 0;

function step16Duration() { return (60 / bpm) / 4; }

function scheduleStep(step, time) {
  // While fill is held, sound comes from the frozen step; the LED still
  // tracks the real step so the user sees where playback will resume.
  const sourceStep = fillActive ? fillStep : step;
  for (let v = 0; v < N_VOICES; v++) {
    const state = pattern[pIdx(v, sourceStep)];
    if (state === 0) continue;
    if (!isAudible(v)) continue;
    voices[v](time, state === 2);
  }
  visualQueue.push({ step, time });
}

function scheduler() {
  while (nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD) {
    // Snap-to-loop-start: commit pending edits right before step 0 plays,
    // so the first beat of the bar already reflects the user's changes.
    if (currentStep === 0 && hasPending) commitPending();
    scheduleStep(currentStep, nextNoteTime);
    nextNoteTime += step16Duration();
    currentStep = (currentStep + 1) % N_STEPS;
  }
}

function play() {
  if (isPlaying) return;
  isPlaying = true;
  currentStep = 0;
  currentAudibleStep = 0;
  lastColStep = -1;
  nextNoteTime = ctx.currentTime + 0.05;
  schedTimer = setInterval(scheduler, LOOKAHEAD_MS);
  document.getElementById('playBtn').classList.add('active');
}

// Tempo +/- long-press: one immediate step on press, then after a short
// delay it auto-repeats with an accelerating interval so the user can
// scrub from 40 → 240 BPM in a couple of seconds without lifting.
function setupBpmRepeat(btn, delta) {
  if (!btn) return;
  let timer = null;
  const stop = () => { if (timer) { clearTimeout(timer); timer = null; } };
  const start = (e) => {
    if (e) e.preventDefault();
    setBPM(bpm + delta);
    let interval = 90;
    const tick = () => {
      setBPM(bpm + delta);
      interval = Math.max(28, interval * 0.92);
      timer = setTimeout(tick, interval);
    };
    timer = setTimeout(tick, 380);
  };
  btn.addEventListener('pointerdown',  start);
  btn.addEventListener('pointerup',    stop);
  btn.addEventListener('pointerleave', stop);
  btn.addEventListener('pointercancel',stop);
  window.addEventListener('blur', stop);
}

function setFillActive(on) {
  if (on && !fillActive) {
    // Latch the step the user is hearing right now. Audio scheduled in the
    // last ~100ms of lookahead will still play the original notes; from
    // then on the scheduler triggers fillStep at the 16th-note rate.
    fillStep = currentAudibleStep;
  }
  fillActive = !!on;
  const btn = document.getElementById('fillBtn');
  if (btn) btn.classList.toggle('holding', fillActive);
}

function bindFillButton() {
  const btn = document.getElementById('fillBtn');
  if (!btn) return;
  const press = async (e) => {
    if (e) e.preventDefault();
    await ensureAudio();
    setFillActive(true);
  };
  const release = (e) => {
    if (e) e.preventDefault();
    setFillActive(false);
  };
  btn.addEventListener('touchstart',  press,   { passive: false });
  btn.addEventListener('touchend',    release, { passive: false });
  btn.addEventListener('touchcancel', release);
  btn.addEventListener('mousedown',   press);
  btn.addEventListener('mouseup',     release);
  btn.addEventListener('mouseleave',  release);
  // Safety: if the page loses focus while held, release.
  window.addEventListener('blur', release);
}
function stop() {
  if (!isPlaying) return;
  isPlaying = false;
  clearInterval(schedTimer); schedTimer = null;
  visualQueue.length = 0;
  // Drop fill if the user kept it held while stopping.
  setFillActive(false);
  document.getElementById('playBtn').classList.remove('active');
  // clear current-step UI
  for (let i = 0; i < N_STEPS; i++) {
    leds[i].classList.remove('on');
    for (let v = 0; v < N_VOICES; v++) cells[v][i].classList.remove('cur');
  }
  lastColStep = -1;
}

/* ====================================================================
   UI
   ==================================================================== */

const grid = document.getElementById('grid');
const stepLedsEl = document.getElementById('stepLeds');
const leds = [];
const cells = Array.from({length: N_VOICES}, () => new Array(N_STEPS));

function buildUI() {
  // step LEDs (16)
  for (let s = 0; s < N_STEPS; s++) {
    const led = document.createElement('div');
    led.className = 'led';
    stepLedsEl.appendChild(led);
    leds.push(led);
  }
  // grid: 7 rows × (label + 16 cells)
  for (let v = 0; v < N_VOICES; v++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.row = v;

    // label cell
    const lab = document.createElement('div');
    lab.className = 'row-label';
    lab.innerHTML = `
      <span class="vname">${VOICE_NAMES[v]}</span>
      <span class="ms">
        <button class="m" data-act="m" data-v="${v}" aria-label="Mute">M</button>
        <button class="s" data-act="s" data-v="${v}" aria-label="Solo">S</button>
      </span>`;
    grid.appendChild(lab);

    for (let s = 0; s < N_STEPS; s++) {
      const c = document.createElement('div');
      c.className = 'cell ' + groupClass(s);
      c.dataset.v = v; c.dataset.s = s;
      grid.appendChild(c);
      cells[v][s] = c;
    }
  }

  // delegated tap handler for cells (touchstart for low-latency)
  const onCellTap = (ev) => {
    const t = ev.target;
    if (!t.classList.contains('cell')) return;
    ev.preventDefault();
    const v = parseInt(t.dataset.v, 10);
    const s = parseInt(t.dataset.s, 10);
    let res;
    if (options.snapNotes) {
      // Edit the pending pattern only; audio keeps using live pattern.
      res = cycleCellOn(pendingPattern, v, s);
    } else {
      // Edit live + mirror to pending so they stay in lockstep.
      res = cycleCellOn(pattern, v, s);
      pendingPattern[pIdx(v, s)] = pattern[pIdx(v, s)];
      if (res.partnerCleared >= 0) {
        pendingPattern[pIdx(res.partnerCleared, s)] = 0;
      }
    }
    renderCell(v, s);
    if (res.partnerCleared >= 0) renderCell(res.partnerCleared, s);
    recomputeHasPending();
  };
  grid.addEventListener('touchstart', onCellTap, { passive: false });
  grid.addEventListener('mousedown', onCellTap);

  // mute / solo
  grid.addEventListener('click', (ev) => {
    const t = ev.target;
    if (!t.dataset || !t.dataset.act) return;
    const v = parseInt(t.dataset.v, 10);
    if (options.snapTracks) {
      if (t.dataset.act === 'm') pendingMuted[v]  = !pendingMuted[v];
      else                       pendingSoloed[v] = !pendingSoloed[v];
    } else {
      if (t.dataset.act === 'm') { muted[v]  = !muted[v];  pendingMuted[v]  = muted[v];  }
      else                       { soloed[v] = !soloed[v]; pendingSoloed[v] = soloed[v]; }
    }
    refreshMSButtons(v);
    if (!options.snapTracks) applyRowDim();
    recomputeHasPending();
  });
}

function groupClass(s) {
  const g = Math.floor(s / 4);
  return ['grp-a','grp-b','grp-c','grp-d'][g];
}

function renderCell(v, s) {
  // Visual truth is always the pending pattern; in non-snap mode it equals
  // the live pattern so this is a no-op visual difference, but the .pending
  // marker only lights up when they actually diverge (snap mode).
  const el = cells[v][s];
  const state = pendingPattern[pIdx(v, s)];
  el.classList.remove('on', 'accent');
  if (state === 1) el.classList.add('on');
  if (state === 2) el.classList.add('accent');
  el.classList.toggle('pending', cellPending(v, s));
}

function refreshMSButtons(v) {
  const mBtn = document.querySelector('.row-label .ms .m[data-v="' + v + '"]');
  const sBtn = document.querySelector('.row-label .ms .s[data-v="' + v + '"]');
  if (mBtn) { mBtn.classList.toggle('on', pendingMuted[v]);  mBtn.classList.toggle('pending', pendingMuted[v]  !== muted[v]); }
  if (sBtn) { sBtn.classList.toggle('on', pendingSoloed[v]); sBtn.classList.toggle('pending', pendingSoloed[v] !== soloed[v]); }
}

function commitNotesOnly() {
  let changed = false;
  for (let i = 0; i < pattern.length; i++) {
    if (pendingPattern[i] !== pattern[i]) { changed = true; break; }
  }
  if (!changed) return;
  pattern.set(pendingPattern);
  for (let v = 0; v < N_VOICES; v++) {
    for (let s = 0; s < N_STEPS; s++) renderCell(v, s);
  }
  recomputeHasPending();
}

function commitTracksOnly() {
  let changed = false;
  for (let v = 0; v < N_VOICES; v++) {
    if (pendingMuted[v] !== muted[v] || pendingSoloed[v] !== soloed[v]) {
      muted[v]  = pendingMuted[v];
      soloed[v] = pendingSoloed[v];
      refreshMSButtons(v);
      changed = true;
    }
  }
  if (changed) { applyRowDim(); recomputeHasPending(); }
}

function commitFxOnly() {
  let changed = false;
  for (const name of FX_NAMES) {
    if (pendingFx[name] !== liveFx[name]) {
      liveFx[name] = pendingFx[name];
      if (master) applyFxToAudio(name, liveFx[name]);
      changed = true;
    }
  }
  if (changed) { updateAllFxPendingMarkers(); recomputeHasPending(); }
}

function commitPending() {
  commitNotesOnly();
  commitTracksOnly();
  commitFxOnly();
}

function clearAllNotes() {
  if (options.snapNotes) {
    pendingPattern.fill(0);
  } else {
    pattern.fill(0);
    pendingPattern.fill(0);
  }
  for (let v = 0; v < N_VOICES; v++) {
    for (let s = 0; s < N_STEPS; s++) renderCell(v, s);
  }
  recomputeHasPending();
}

function applyRowDim() {
  const anySolo = soloed.some(Boolean);
  for (let v = 0; v < N_VOICES; v++) {
    const audible = anySolo ? (soloed[v] && !muted[v]) : !muted[v];
    const dim = !audible;
    for (let s = 0; s < N_STEPS; s++) {
      cells[v][s].classList.toggle('row-dim', dim);
    }
  }
}

// Add a per-cell dim style since `.row` uses display:contents
const dimStyle = document.createElement('style');
dimStyle.textContent = `.cell.row-dim { opacity: .35; filter: grayscale(.5) brightness(.8); }`;
document.head.appendChild(dimStyle);

/* ---------- transport / bpm ---------- */

function setBPM(v) {
  bpm = Math.max(40, Math.min(240, v|0));
  const el = document.getElementById('bpmDisplay');
  if (el && document.activeElement !== el) el.value = String(bpm);
  applyDelayFromOptions();
}

function applyDelayFromOptions() {
  if (master) master.setDelayTime(delaySecondsFromOptions(bpm));
}

function bindTransport() {
  document.getElementById('playBtn').addEventListener('click', async () => {
    await ensureAudio();
    hideBoot();
    if (!isPlaying) play();
  });
  document.getElementById('stopBtn').addEventListener('click', stop);
  document.getElementById('clearBtn').addEventListener('click', clearAllNotes);
  document.getElementById('optBtn').addEventListener('click', showOptions);
  bindFillButton();
  setupBpmRepeat(document.getElementById('bpmUp'),   +1);
  setupBpmRepeat(document.getElementById('bpmDown'), -1);
  const bpmEl = document.getElementById('bpmDisplay');
  bpmEl.addEventListener('focus', () => bpmEl.select());
  const commitBpm = () => {
    const n = parseInt(bpmEl.value, 10);
    if (Number.isFinite(n)) setBPM(n); else bpmEl.value = String(bpm);
  };
  bpmEl.addEventListener('change', commitBpm);
  bpmEl.addEventListener('blur', commitBpm);
  bpmEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); bpmEl.blur(); }
  });
  // Machine toggle: button label is the *destination*. 303 view not built
  // yet, so this only flips the label for now; real view switching lands
  // when the Bass screen is implemented.
  document.getElementById('pageToggle').addEventListener('click', switchMachine);
}

let currentMachine = '808';
function switchMachine() {
  currentMachine = currentMachine === '808' ? '303' : '808';
  document.getElementById('pageToggle').textContent =
    currentMachine === '808' ? '303' : '808';
}

/* ---------- FX sliders ---------- */

const SLIDER_MAX = 1000;

function applyFxToAudio(name, sliderValue) {
  if (!master) return;
  const v = sliderValue / SLIDER_MAX;
  if (name === 'drive')       master.setDrive(v);
  else if (name === 'cutoff') master.setCutoff(30 * Math.pow(18000 / 30, v));  // log
  else if (name === 'delay')  master.setDelay(v);
  else if (name === 'reverb') master.setReverb(v);
}

function updateFxPendingMarker(name) {
  const el = FX_ELEMENTS[name];
  if (!el) return;
  el.parentElement.classList.toggle('pending', pendingFx[name] !== liveFx[name]);
}
function updateAllFxPendingMarkers() {
  for (const name of FX_NAMES) updateFxPendingMarker(name);
}

function onFxInput(name, sliderValue) {
  pendingFx[name] = sliderValue;
  if (!options.snapEffects) {
    liveFx[name] = sliderValue;
    applyFxToAudio(name, sliderValue);
  }
  updateFxPendingMarker(name);
  recomputeHasPending();
}

function resetFx(name) {
  // Immediate — bypasses snap deliberately so the reset acts as a panic
  // button. Doesn't touch DEFAULTS / options; only this slider's live and
  // pending positions are restored.
  const def = FX_DEFAULTS[name];
  const el  = FX_ELEMENTS[name];
  if (el) el.value = String(def);
  pendingFx[name] = def;
  liveFx[name]    = def;
  applyFxToAudio(name, def);
  updateFxPendingMarker(name);
  recomputeHasPending();
}

function bindFX() {
  const ids = { drive: 'fxDrive', cutoff: 'fxCutoff', delay: 'fxDelay', reverb: 'fxReverb' };
  for (const [name, id] of Object.entries(ids)) {
    const el = document.getElementById(id);
    FX_ELEMENTS[name] = el;
    pendingFx[name] = liveFx[name] = parseFloat(el.value);
    el.addEventListener('input', async () => {
      await ensureAudio();
      onFxInput(name, parseFloat(el.value));
    });
  }
  document.querySelectorAll('.fx-reset').forEach(btn => {
    btn.addEventListener('click', async () => {
      await ensureAudio();
      resetFx(btn.dataset.fx);
    });
  });
  // Idempotent applier: sync current liveFx to audio after ensureAudio.
  return () => {
    for (const name of FX_NAMES) applyFxToAudio(name, liveFx[name]);
  };
}

/* ---------- step LED render loop ---------- */

let lastColStep = -1;   // last column highlighted by the .cur ring

function renderLoop() {
  if (ctx && isPlaying) {
    const now = ctx.currentTime;
    let ledStep = -1;
    while (visualQueue.length > 0 && visualQueue[0].time <= now) {
      const { step } = visualQueue.shift();
      currentAudibleStep = step;
      ledStep = step;
    }
    // Top-right step LEDs always reflect the internal sequencer position,
    // unaffected by fill — they're the user's "where we really are" anchor.
    if (ledStep >= 0) {
      for (let i = 0; i < N_STEPS; i++) {
        leds[i].classList.toggle('on', i === ledStep);
      }
    }
    // Column playhead ring: freeze on fillStep while fill is held so the
    // user sees which step is being repeated; otherwise it tracks the
    // currently audible step.
    const colStep = fillActive ? fillStep : currentAudibleStep;
    if (colStep !== lastColStep) {
      for (let v = 0; v < N_VOICES; v++) {
        for (let i = 0; i < N_STEPS; i++) {
          cells[v][i].classList.toggle('cur', i === colStep);
        }
      }
      lastColStep = colStep;
    }
  }
  requestAnimationFrame(renderLoop);
}

/* ---------- boot overlay ---------- */

function hideBoot() {
  document.getElementById('boot').classList.add('hidden');
}
function bindBoot(applyFX) {
  const boot = document.getElementById('boot');
  const fire = async () => {
    await ensureAudio();
    if (applyFX) applyFX();
    hideBoot();
  };
  boot.addEventListener('touchstart', fire, { passive: true });
  boot.addEventListener('click', fire);
}

/* ---------- visibility / iOS resume ---------- */

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && ctx && ctx.state === 'suspended') {
    ctx.resume().catch(()=>{});
  }
});

/* ---------- Options screen ---------- */

const DELAY_SPEC = [
  { denom:  1, dotted: false, label: '1/1'   },
  { denom:  2, dotted: false, label: '1/2'   },
  { denom:  4, dotted: false, label: '1/4'   },
  { denom:  8, dotted: false, label: '1/8'   },
  { denom: 16, dotted: false, label: '1/16'  },
  { denom:  1, dotted: true,  label: '1/1.'  },
  { denom:  2, dotted: true,  label: '1/2.'  },
  { denom:  4, dotted: true,  label: '1/4.'  },
  { denom:  8, dotted: true,  label: '1/8.'  },
  { denom: 16, dotted: true,  label: '1/16.' },
];

function showOptions() {
  refreshOptionsUI();
  document.getElementById('optionsOverlay').classList.remove('hidden');
}
function hideOptions() {
  document.getElementById('optionsOverlay').classList.add('hidden');
}

function pickDelay(denom, dotted) {
  options.delayDenom = denom;
  options.delayDotted = dotted;
  applyDelayFromOptions();
  refreshDelayUI();
}

// Per-category snap toggle. cat ∈ {'Notes','Tracks','Effects'}.
// off→on: re-sync this category's pending mirror to live (no spurious
// pending state). on→off: commit only this category's pending edits so
// they don't get stranded.
function toggleSnap(cat) {
  const key = 'snap' + cat;
  const next = !options[key];
  if (options[key] && !next) {
    if      (cat === 'Notes')   commitNotesOnly();
    else if (cat === 'Tracks')  commitTracksOnly();
    else if (cat === 'Effects') commitFxOnly();
  } else if (!options[key] && next) {
    if (cat === 'Notes') {
      pendingPattern.set(pattern);
      for (let v = 0; v < N_VOICES; v++)
        for (let s = 0; s < N_STEPS; s++) renderCell(v, s);
    } else if (cat === 'Tracks') {
      for (let v = 0; v < N_VOICES; v++) {
        pendingMuted[v]  = muted[v];
        pendingSoloed[v] = soloed[v];
        refreshMSButtons(v);
      }
    } else if (cat === 'Effects') {
      for (const n of FX_NAMES) pendingFx[n] = liveFx[n];
      updateAllFxPendingMarkers();
    }
    recomputeHasPending();
  }
  options[key] = next;
  refreshSnapUI();
}

function refreshDelayUI() {
  document.querySelectorAll('#delayDenomRow .btn, #delayDottedRow .btn').forEach(btn => {
    const d = parseInt(btn.dataset.denom, 10);
    const dot = btn.dataset.dotted === '1';
    btn.classList.toggle('active',
      d === options.delayDenom && dot === options.delayDotted);
  });
  const spec = DELAY_SPEC.find(s => s.denom === options.delayDenom && s.dotted === options.delayDotted);
  document.getElementById('delayActiveLbl').textContent = spec ? spec.label : '?';
}
function refreshSnapUI() {
  for (const cat of ['Notes','Tracks','Effects']) {
    const btn = document.querySelector(`.snap-pill[data-snap="${cat}"]`);
    if (btn) btn.classList.toggle('active', !!options['snap' + cat]);
  }
}
function refreshOptionsUI() {
  refreshDelayUI();
  refreshSnapUI();
  document.getElementById('optReso').value = Math.round(options.resonance * 1000);
}

function initOptions() {
  // Populate delay button rows
  const denomRow  = document.getElementById('delayDenomRow');
  const dottedRow = document.getElementById('delayDottedRow');
  DELAY_SPEC.forEach(spec => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = spec.label;
    b.dataset.denom = String(spec.denom);
    b.dataset.dotted = spec.dotted ? '1' : '0';
    b.addEventListener('click', () => pickDelay(spec.denom, spec.dotted));
    (spec.dotted ? dottedRow : denomRow).appendChild(b);
  });

  document.getElementById('optBack').addEventListener('click', hideOptions);
  // Backdrop tap closes; click inside the card does not.
  const overlay = document.getElementById('optionsOverlay');
  overlay.addEventListener('click', (e) => { if (e.target === overlay) hideOptions(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !overlay.classList.contains('hidden')) hideOptions();
  });

  document.getElementById('optReso').addEventListener('input', (e) => {
    options.resonance = parseFloat(e.target.value) / 1000;
    if (master) master.setReso(options.resonance);
  });

  document.querySelectorAll('.snap-pill').forEach(btn => {
    btn.addEventListener('click', () => toggleSnap(btn.dataset.snap));
  });

  document.getElementById('optReset').addEventListener('click', () => {
    // Don't strand the user's in-progress edits.
    if (hasPending) commitPending();
    Object.assign(options, DEFAULTS);
    applyDelayFromOptions();
    if (master) master.setReso(options.resonance);
    refreshOptionsUI();
  });

  refreshOptionsUI();
}

/* ---------- Tap acknowledgement (universal touch feedback) ----------
   Document-level pointerdown delegation flashes any interactive control
   for 180ms, even when the action is a no-op. Best-effort haptic
   vibration on Android; iOS Safari silently ignores it. */

const ACK_SELECTOR =
  '.btn, .cell, .row-label .ms button, .page-btn, .fill-btn, ' +
  '.fx-reset, input[type=range], input.display';

function ackTap(el) {
  el.classList.remove('ack-flash');
  void el.offsetWidth;   // force reflow so the animation restarts on rapid taps
  el.classList.add('ack-flash');
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
}

function bindAckFeedback() {
  document.addEventListener('pointerdown', (e) => {
    const t = e.target.closest(ACK_SELECTOR);
    if (!t || t.disabled) return;
    ackTap(t);
  }, { passive: true });
  document.addEventListener('animationend', (e) => {
    if (e.animationName === 'ackTap') e.target.classList.remove('ack-flash');
  });
}

/* ---------- bootstrap ---------- */

buildUI();
bindTransport();
const applyFX = bindFX();
bindBoot(applyFX);
initOptions();
bindAckFeedback();
setBPM(120);
requestAnimationFrame(renderLoop);

// Default: kick four-on-the-floor only. Users add the rest.
(function defaultPattern() {
  const I = (v, s, a = 1) => { pattern[pIdx(v, s)] = a; pendingPattern[pIdx(v, s)] = a; };
  I(0, 0, 1); I(0, 4, 1); I(0, 8, 1); I(0, 12, 1);
  for (let v = 0; v < N_VOICES; v++) {
    for (let s = 0; s < N_STEPS; s++) renderCell(v, s);
  }
})();

</script>
