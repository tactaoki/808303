<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c4525"/>
      <stop offset="1" stop-color="#5a2f17"/>
    </linearGradient>
    <linearGradient id="onGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="0.6" stop-color="#e88a2e"/>
      <stop offset="1" stop-color="#a85e10"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7c5a"/>
      <stop offset="0.6" stop-color="#d32a18"/>
      <stop offset="1" stop-color="#6e1408"/>
    </linearGradient>
    <linearGradient id="creamCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe2c2"/>
      <stop offset="1" stop-color="#c9b88f"/>
    </linearGradient>
    <linearGradient id="silverCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aeb4ba"/>
      <stop offset="1" stop-color="#8e9298"/>
    </linearGradient>
    <linearGradient id="blackCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3e"/>
      <stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dccba1"/>
      <stop offset="1" stop-color="#b89e6b"/>
    </linearGradient>
  </defs>

  <!-- Wood chassis -->
  <rect width="1200" height="630" fill="url(#woodGrad)"/>

  <!-- Inner panel -->
  <rect x="40" y="40" width="1120" height="550" rx="14" fill="url(#panel)" stroke="#3a2010" stroke-width="2"/>

  <!-- Brand badge -->
  <rect x="70" y="70" width="280" height="64" rx="6" fill="#1a1a1c"/>
  <text x="210" y="115" text-anchor="middle"
        font-family="ui-monospace, Menlo, Consolas, monospace"
        font-size="34" font-weight="900" fill="#f0f0f2" letter-spacing="4">808.303.020</text>

  <!-- Tagline -->
  <text x="380" y="100" font-family="-apple-system, system-ui, sans-serif"
        font-size="18" font-weight="600" fill="#3a2010" letter-spacing="1">
    Rhythm composer · Bass · Mono synth
  </text>
  <text x="380" y="124" font-family="-apple-system, system-ui, sans-serif"
        font-size="14" font-weight="400" fill="#5a3a20" letter-spacing="0.5">
    Pure Web Audio · Zero samples · Single HTML file
  </text>

  <!-- Step LED strip (16 LEDs, position 3 is "current") -->
  <g transform="translate(70, 160)">
    <rect x="-8" y="-8" width="1066" height="34" rx="6" fill="#1a1a1c"/>
    <g>
      <!-- 16 LEDs across 1050px wide → 66px each -->
      <!-- LEDs are 14x14 with 50px gaps; recalc: 16 cells, w=14, gap = (1050 - 16*14)/15 ≈ 55 -->
    </g>
    <g fill="#3a2818">
      <!-- positions: i*65 + 6 -->
    </g>
    <!-- Step LEDs explicitly -->
    <g>
      <circle cx="14"   cy="9" r="7" fill="#3a2818"/>
      <circle cx="79"   cy="9" r="7" fill="#3a2818"/>
      <circle cx="144"  cy="9" r="7" fill="#3a2818"/>
      <circle cx="209"  cy="9" r="7" fill="#e88a2e"/>  <!-- current step lit -->
      <circle cx="274"  cy="9" r="7" fill="#3a2818"/>
      <circle cx="339"  cy="9" r="7" fill="#3a2818"/>
      <circle cx="404"  cy="9" r="7" fill="#3a2818"/>
      <circle cx="469"  cy="9" r="7" fill="#3a2818"/>
      <circle cx="534"  cy="9" r="7" fill="#3a2818"/>
      <circle cx="599"  cy="9" r="7" fill="#3a2818"/>
      <circle cx="664"  cy="9" r="7" fill="#3a2818"/>
      <circle cx="729"  cy="9" r="7" fill="#3a2818"/>
      <circle cx="794"  cy="9" r="7" fill="#3a2818"/>
      <circle cx="859"  cy="9" r="7" fill="#3a2818"/>
      <circle cx="924"  cy="9" r="7" fill="#3a2818"/>
      <circle cx="989"  cy="9" r="7" fill="#3a2818"/>
    </g>
  </g>

  <!-- 3 rows of step cells: BD / Bass / Lead, each 16 steps -->
  <!-- Each cell ~60w × ~80h, gap 4. Start x=70, total width 1050 → cell = (1050 - 15*4)/16 ≈ 61.875 -->
  <!-- Row layout: y=210 (BD/808), 310 (303), 410 (Lead) -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="800" font-size="14">

    <!-- 808 row (cream/orange) - kick pattern 4-on-the-floor + clap -->
    <rect x="70" y="210" width="55" height="78" rx="4" fill="#efe2c2" stroke="#3a2010"/>
    <text x="97.5" y="255" text-anchor="middle" fill="#1a1a1c">BD</text>
    <!-- 16 cells starting at x=135. cell width 61, gap 4 -->
    <g>
      <!-- step 0: on -->
      <rect x="135" y="210" width="61" height="78" rx="4" fill="url(#onGrad)" stroke="#3a2010"/>
      <!-- step 1: off cream -->
      <rect x="200" y="210" width="61" height="78" rx="4" fill="url(#creamCell)" stroke="#3a2010"/>
      <rect x="265" y="210" width="61" height="78" rx="4" fill="url(#creamCell)" stroke="#3a2010"/>
      <rect x="330" y="210" width="61" height="78" rx="4" fill="url(#creamCell)" stroke="#3a2010"/>
      <!-- step 4: on -->
      <rect x="395" y="210" width="61" height="78" rx="4" fill="url(#onGrad)" stroke="#3a2010"/>
      <rect x="460" y="210" width="61" height="78" rx="4" fill="url(#creamCell)" stroke="#3a2010"/>
      <!-- step 6: accent (clap-style) -->
      <rect x="525" y="210" width="61" height="78" rx="4" fill="url(#accGrad)" stroke="#3a2010"/>
      <rect x="590" y="210" width="61" height="78" rx="4" fill="url(#creamCell)" stroke="#3a2010"/>
      <!-- step 8: on -->
      <rect x="655" y="210" width="61" height="78" rx="4" fill="url(#onGrad)" stroke="#3a2010"/>
      <rect x="720" y="210" width="61" height="78" rx="4" fill="url(#creamCell)" stroke="#3a2010"/>
      <rect x="785" y="210" width="61" height="78" rx="4" fill="url(#creamCell)" stroke="#3a2010"/>
      <rect x="850" y="210" width="61" height="78" rx="4" fill="url(#creamCell)" stroke="#3a2010"/>
      <!-- step 12: on -->
      <rect x="915" y="210" width="61" height="78" rx="4" fill="url(#onGrad)" stroke="#3a2010"/>
      <rect x="980" y="210" width="61" height="78" rx="4" fill="url(#creamCell)" stroke="#3a2010"/>
      <!-- step 14: accent -->
      <rect x="1045" y="210" width="61" height="78" rx="4" fill="url(#accGrad)" stroke="#3a2010"/>
      <rect x="1110" y="210" width="40" height="78" rx="4" fill="url(#creamCell)" stroke="#3a2010"/>
    </g>

    <!-- 303 row (silver/orange) - bass line -->
    <rect x="70" y="298" width="55" height="78" rx="4" fill="#1a1a1c" stroke="#3a2010"/>
    <text x="97.5" y="343" text-anchor="middle" fill="#e8e8ea">A3</text>
    <g>
      <rect x="135" y="298" width="61" height="78" rx="4" fill="url(#onGrad)" stroke="#3a2010"/>
      <rect x="200" y="298" width="61" height="78" rx="4" fill="url(#silverCell)" stroke="#3a2010"/>
      <rect x="265" y="298" width="61" height="78" rx="4" fill="url(#onGrad)" stroke="#3a2010"/>
      <rect x="330" y="298" width="61" height="78" rx="4" fill="url(#onGrad)" stroke="#3a2010"/>
      <rect x="395" y="298" width="61" height="78" rx="4" fill="url(#silverCell)" stroke="#3a2010"/>
      <rect x="460" y="298" width="61" height="78" rx="4" fill="url(#accGrad)" stroke="#3a2010"/>
      <rect x="525" y="298" width="61" height="78" rx="4" fill="url(#silverCell)" stroke="#3a2010"/>
      <rect x="590" y="298" width="61" height="78" rx="4" fill="url(#onGrad)" stroke="#3a2010"/>
      <rect x="655" y="298" width="61" height="78" rx="4" fill="url(#silverCell)" stroke="#3a2010"/>
      <rect x="720" y="298" width="61" height="78" rx="4" fill="url(#onGrad)" stroke="#3a2010"/>
      <rect x="785" y="298" width="61" height="78" rx="4" fill="url(#silverCell)" stroke="#3a2010"/>
      <rect x="850" y="298" width="61" height="78" rx="4" fill="url(#accGrad)" stroke="#3a2010"/>
      <rect x="915" y="298" width="61" height="78" rx="4" fill="url(#onGrad)" stroke="#3a2010"/>
      <rect x="980" y="298" width="61" height="78" rx="4" fill="url(#silverCell)" stroke="#3a2010"/>
      <rect x="1045" y="298" width="61" height="78" rx="4" fill="url(#onGrad)" stroke="#3a2010"/>
      <rect x="1110" y="298" width="40" height="78" rx="4" fill="url(#silverCell)" stroke="#3a2010"/>
    </g>

    <!-- 020 (Lead) row (black/orange) - sparse melody -->
    <rect x="70" y="386" width="55" height="78" rx="4" fill="#1a1a1c" stroke="#3a2010"/>
    <text x="97.5" y="431" text-anchor="middle" fill="#e8e8ea">E5</text>
    <g>
      <rect x="135" y="386" width="61" height="78" rx="4" fill="url(#blackCell)" stroke="#3a2010"/>
      <rect x="200" y="386" width="61" height="78" rx="4" fill="url(#blackCell)" stroke="#3a2010"/>
      <rect x="265" y="386" width="61" height="78" rx="4" fill="url(#onGrad)" stroke="#3a2010"/>
      <rect x="330" y="386" width="61" height="78" rx="4" fill="url(#blackCell)" stroke="#3a2010"/>
      <rect x="395" y="386" width="61" height="78" rx="4" fill="url(#blackCell)" stroke="#3a2010"/>
      <rect x="460" y="386" width="61" height="78" rx="4" fill="url(#blackCell)" stroke="#3a2010"/>
      <rect x="525" y="386" width="61" height="78" rx="4" fill="url(#onGrad)" stroke="#3a2010"/>
      <rect x="590" y="386" width="61" height="78" rx="4" fill="url(#blackCell)" stroke="#3a2010"/>
      <rect x="655" y="386" width="61" height="78" rx="4" fill="url(#blackCell)" stroke="#3a2010"/>
      <rect x="720" y="386" width="61" height="78" rx="4" fill="url(#onGrad)" stroke="#3a2010"/>
      <rect x="785" y="386" width="61" height="78" rx="4" fill="url(#blackCell)" stroke="#3a2010"/>
      <rect x="850" y="386" width="61" height="78" rx="4" fill="url(#blackCell)" stroke="#3a2010"/>
      <rect x="915" y="386" width="61" height="78" rx="4" fill="url(#blackCell)" stroke="#3a2010"/>
      <rect x="980" y="386" width="61" height="78" rx="4" fill="url(#accGrad)" stroke="#3a2010"/>
      <rect x="1045" y="386" width="61" height="78" rx="4" fill="url(#blackCell)" stroke="#3a2010"/>
      <rect x="1110" y="386" width="40" height="78" rx="4" fill="url(#blackCell)" stroke="#3a2010"/>
    </g>
  </g>

  <!-- FX slider strip at bottom -->
  <g transform="translate(70, 490)" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1c">
    <rect x="0" y="0" width="1060" height="60" rx="6" fill="#1a1a1c" stroke="#3a2010"/>
    <g fill="#e8e8ea">
      <text x="30" y="22">DRIVE</text>
      <text x="290" y="22">CUTOFF</text>
      <text x="550" y="22">DELAY</text>
      <text x="810" y="22">REVERB</text>
    </g>
    <!-- 4 slider tracks -->
    <g>
      <rect x="30"  y="34" width="220" height="6" rx="3" fill="#3a3a3e"/>
      <rect x="290" y="34" width="220" height="6" rx="3" fill="#3a3a3e"/>
      <rect x="550" y="34" width="220" height="6" rx="3" fill="#3a3a3e"/>
      <rect x="810" y="34" width="220" height="6" rx="3" fill="#3a3a3e"/>
      <!-- thumbs -->
      <circle cx="100" cy="37" r="10" fill="url(#onGrad)" stroke="#1a1a1c" stroke-width="2"/>
      <circle cx="450" cy="37" r="10" fill="url(#onGrad)" stroke="#1a1a1c" stroke-width="2"/>
      <circle cx="620" cy="37" r="10" fill="url(#onGrad)" stroke="#1a1a1c" stroke-width="2"/>
      <circle cx="940" cy="37" r="10" fill="url(#onGrad)" stroke="#1a1a1c" stroke-width="2"/>
    </g>
  </g>

  <!-- Footer tag -->
  <text x="600" y="615" text-anchor="middle"
        font-family="ui-monospace, Menlo, Consolas, monospace"
        font-size="14" font-weight="700" fill="#dccba1" letter-spacing="2">
    tactaoki.github.io/808303
  </text>
</svg>
